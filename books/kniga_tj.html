<head>
<meta charset="UTF-8">

<title>Как понравиться девушке — Эдриан Трейп</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A1130;
    --lapis: #12224A;
    --lapis-2: #1C3068;
    --pom: #D23A55;
    --saffron: #F2B632;
    --chalk: #F5F1EA;
    --muted: #B4BCD6;
    --line: rgba(245, 241, 234, .16);
    --display: "Oswald", "Arial Narrow", "Impact", sans-serif;
    --text: "PT Sans", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--chalk);
    font-family: var(--text);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }

  /* ---------- top bar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10, 17, 48, .92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar-in {
    max-width: 860px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--display); font-weight: 500; font-size: 17px; letter-spacing: .02em; color: var(--muted); }
  .lang { display: none; }
  .lang-old { display: inline-flex; border: 2px solid var(--saffron); border-radius: 999px; overflow: hidden; }
  .lang button {
    font: 700 15px var(--display); letter-spacing: .06em;
    background: transparent; color: var(--saffron);
    border: 0; padding: 7px 18px; cursor: pointer; min-height: 40px;
  }
  .lang button[aria-pressed="true"] { background: var(--saffron); color: var(--ink); }
  .progress { height: 3px; background: transparent; }
  .progress i { display: block; height: 100%; width: 0; background: var(--pom); }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    padding: 64px 20px 72px;
    background:
      linear-gradient(135deg, rgba(210,58,85,.0) 0%, rgba(210,58,85,.0) 60%, rgba(210,58,85,.18) 100%),
      var(--lapis);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; opacity: .10; pointer-events: none;
    background-image:
      linear-gradient(45deg, var(--chalk) 1px, transparent 1px),
      linear-gradient(-45deg, var(--chalk) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .hero-in { position: relative; max-width: 860px; margin: 0 auto; }
  .hero h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(46px, 13vw, 118px);
    line-height: .96; letter-spacing: -.005em;
    margin: 0 0 24px; max-width: 12ch;
  }
  .hero .tag {
    font-size: clamp(20px, 4.4vw, 26px); line-height: 1.35;
    max-width: 30ch; margin: 0 0 12px; color: var(--saffron); font-weight: 700;
  }
  .hero .sub { color: var(--muted); max-width: 46ch; margin: 0 0 28px; }
  .hero .by {
    display: inline-block; border-left: 4px solid var(--pom);
    padding: 2px 0 2px 14px; font-family: var(--display); font-size: 20px; margin-bottom: 30px;
  }
  .btn {
    display: inline-block; text-decoration: none;
    background: var(--pom); color: #fff;
    font: 700 18px var(--display); letter-spacing: .04em;
    padding: 14px 30px; border-radius: 4px;
  }
  .btn:hover { background: #e2506b; }

  /* ---------- layout ---------- */
  main { max-width: 860px; margin: 0 auto; padding: 0 20px 40px; }

  .toc { padding: 44px 0 8px; }
  .toc h2, .plan h2 { font-family: var(--display); font-size: 34px; margin: 0 0 18px; font-weight: 700; }
  .toc ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr; gap: 0; }
  .toc li { border-top: 1px solid var(--line); }
  .toc li:last-child { border-bottom: 1px solid var(--line); }
  .toc a { display: flex; gap: 14px; align-items: baseline; padding: 12px 0; text-decoration: none; }
  .toc a:hover .t { color: var(--saffron); }
  .toc .n { font-family: var(--display); color: var(--pom); font-weight: 700; min-width: 28px; font-size: 20px; }
  .toc .t { font-size: 18px; }
  @media (min-width: 760px) {
    .toc ol { grid-template-columns: 1fr 1fr; column-gap: 40px; }
    .toc li:nth-last-child(2) { border-bottom: 1px solid var(--line); }
  }

  /* ---------- chapter ---------- */
  .chapter { padding: 64px 0 8px; border-top: 1px solid var(--line); margin-top: 56px; }
  .ch-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
  .num {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(72px, 20vw, 132px); line-height: .8;
    color: transparent; -webkit-text-stroke: 2px var(--saffron);
    min-width: .62em;
  }
  .ch-head h2 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(28px, 7vw, 46px); line-height: 1.05; margin: 4px 0 0;
  }
  .ch-head .kick { display: block; color: var(--muted); font: 500 15px var(--display); margin-bottom: 6px; letter-spacing: .02em; }
  .lead { font-size: 21px; line-height: 1.5; color: var(--chalk); max-width: 60ch; margin: 0 0 24px; font-weight: 700; }

  .points { list-style: none; margin: 0 0 28px; padding: 0; max-width: 62ch; }
  .points li { position: relative; padding: 0 0 16px 30px; }
  .points li::before {
    content: ""; position: absolute; left: 0; top: .62em;
    width: 12px; height: 12px; background: var(--pom); transform: rotate(45deg);
  }

  .example { display: grid; gap: 12px; margin: 0 0 24px; }
  @media (min-width: 700px) { .example { grid-template-columns: 1fr 1fr; } }
  .ex { padding: 16px 18px; border-radius: 4px; background: var(--lapis); }
  .ex b { display: block; font-family: var(--display); font-size: 17px; letter-spacing: .03em; margin-bottom: 6px; }
  .ex p { margin: 0; font-size: 18px; }
  .ex.bad { border-left: 5px solid var(--pom); }
  .ex.bad b { color: #FF7B92; }
  .ex.good { border-left: 5px solid var(--saffron); }
  .ex.good b { color: var(--saffron); }

  .task {
    display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left;
    background: transparent; color: var(--chalk);
    border: 2px dashed var(--saffron); border-radius: 6px;
    padding: 16px 18px; cursor: pointer; font: inherit;
  }
  .task .box {
    flex: none; width: 26px; height: 26px; border: 2px solid var(--saffron); border-radius: 4px;
    display: grid; place-items: center; margin-top: 2px; color: var(--ink); font-weight: 700;
  }
  .task .lbl { display: block; font-family: var(--display); color: var(--saffron); font-size: 16px; letter-spacing: .03em; margin-bottom: 2px; }
  .task[aria-pressed="true"] { border-style: solid; background: rgba(242,182,50,.10); }
  .task[aria-pressed="true"] .box { background: var(--saffron); }
  .task[aria-pressed="true"] .box::after { content: "✓"; }
  .tap { color: var(--muted); font-size: 15px; margin: 10px 0 0; }

  /* ---------- plan ---------- */
  .plan { padding: 64px 0 8px; border-top: 1px solid var(--line); margin-top: 64px; }
  .plan > p { color: var(--muted); max-width: 52ch; margin: 0 0 28px; }
  .weeks { list-style: none; margin: 0; padding: 0; position: relative; }
  .weeks::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px; width: 3px; background: var(--pom); }
  .weeks li { position: relative; padding: 0 0 26px 52px; }
  .weeks li::before {
    content: ""; position: absolute; left: 6px; top: 6px; width: 21px; height: 21px;
    background: var(--ink); border: 4px solid var(--saffron); border-radius: 50%;
  }
  .weeks h3 { font-family: var(--display); font-size: 24px; margin: 0 0 4px; color: var(--saffron); }
  .weeks p { margin: 0; }

  /* ---------- outro ---------- */
  .outro { margin-top: 64px; padding: 56px 24px; background: var(--pom); border-radius: 6px; }
  .outro q {
    display: block; quotes: none;
    font-family: var(--display); font-weight: 700; line-height: 1.08;
    font-size: clamp(30px, 8vw, 58px); max-width: 16ch;
  }
  .outro cite { display: block; margin-top: 20px; font-style: normal; font-size: 19px; }
  footer { text-align: left; color: var(--muted); font-size: 15px; padding: 28px 0 60px; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

/* ============ РЕНДЕР ============ */
const app = document.getElementById("app");
let lang = "tj";
let done = {};

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function loadState() {
  try {
    const d = localStorage.getItem("trp-done");
    if (d) done = JSON.parse(d) || {};
  } catch (e) { /* хранилище недоступно */ }
}
function saveState() {
  try {
        localStorage.setItem("trp-done", JSON.stringify(done));
  } catch (e) { /* игнорируем */ }
}

function render() {
  const u = UI[lang];
  document.documentElement.lang = lang === "tj" ? "tg" : "ru";
  document.title = u.doc;
  document.getElementById("brand").textContent = u.brand;
  document.getElementById("h1").textContent = u.h1;
  document.getElementById("tag").textContent = u.tag;
  document.getElementById("sub").textContent = u.sub;
  document.getElementById("by").textContent = u.by;
  document.getElementById("start").textContent = u.start;

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  });

  let html = "";

  /* оглавление */
  html += '<nav class="toc" id="toc"><h2>' + esc(u.toc) + "</h2><ol>";
  CH.forEach(function (c, i) {
    html += '<li><a href="#c' + (i + 1) + '"><span class="n">' + (i + 1) +
            '</span><span class="t">' + esc(c[lang].t) + "</span></a></li>";
  });
  html += "</ol></nav>";

  /* главы */
  CH.forEach(function (c, i) {
    const d = c[lang];
    html += '<section class="chapter" id="c' + (i + 1) + '">';
    html += '<div class="ch-head"><span class="num" aria-hidden="true">' + (i + 1) + "</span>" +
            '<h2><span class="kick">' + esc(u.chapter) + " " + (i + 1) + "</span>" + esc(d.t) + "</h2></div>";
    html += '<p class="lead">' + esc(d.lead) + "</p>";
    html += '<ul class="points">' + d.pts.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>";
    if (d.bad && d.good) {
      html += '<div class="example">' +
        '<div class="ex bad"><b>' + esc(u.bad) + "</b><p>" + esc(d.bad) + "</p></div>" +
        '<div class="ex good"><b>' + esc(u.good) + "</b><p>" + esc(d.good) + "</p></div></div>";
    }
    html += '<button type="button" class="task" data-i="' + i + '" aria-pressed="' + (done[i] ? "true" : "false") + '">' +
            '<span class="box"></span><span><span class="lbl">' + esc(u.task) + "</span>" + esc(d.task) + "</span></button>";
    if (i === 0) html += '<p class="tap">' + esc(u.tap) + "</p>";
    html += "</section>";
  });

  /* план */
  html += '<section class="plan" id="plan"><h2>' + esc(u.plan) + "</h2><p>" + esc(u.planLead) + '</p><ol class="weeks">';
  PLAN.forEach(function (w, i) {
    html += "<li><h3>" + esc(u.week) + " " + (i + 1) + "</h3><p>" + esc(w[lang]) + "</p></li>";
  });
  html += "</ol></section>";

  /* финал */
  html += '<div class="outro"><q>' + esc(u.quote) + "</q><cite>— " + esc(u.cite) + "</cite></div>";
  html += "<footer>" + esc(u.foot) + "</footer>";

  app.innerHTML = html;
}

/* переключатель языка */
document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () {
    lang = b.dataset.lang;
    saveState();
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  });
});

/* отметка заданий */
app.addEventListener("click", function (e) {
  const t = e.target.closest(".task");
  if (!t) return;
  const i = t.dataset.i;
  done[i] = !done[i];
  t.setAttribute("aria-pressed", done[i] ? "true" : "false");
  saveState();
});

/* прогресс чтения */
const prog = document.getElementById("prog");
function onScroll() {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  prog.style.width = (h > 0 ? Math.min(100, (window.scrollY / h) * 100) : 0) + "%";
}
window.addEventListener("scroll", onScroll, { passive: true });

loadState();
render();
onScroll();
</script>
